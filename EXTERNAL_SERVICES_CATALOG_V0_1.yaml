catalog:
  name: External Services Catalog v0.1
  date: '2026-09-06'
  entries: 38
  enabled_entries: 15
  principles:
  - Detection of a service is a technical fact, not a legal verdict.
  - provider_scope is descriptive only and MUST NOT be treated as data-residency evidence.
  - Foreign provider/endpoint MUST NOT automatically produce a localization or cross-border FAIL.
  - Entries with confidence=CANDIDATE remain disabled until current official integration signatures are verified.
  - Prefer path/script/signature matching over broad top-level-domain matching.
  provider_scope_semantics:
    RU_PROVIDER: Provider is treated as a Russian-provider signal for catalog purposes; actual contract/data flow still requires
      verification.
    RU_MARKET_PROVIDER: Provider is common in the Russian market; legal entity/infrastructure may require project-specific
      verification.
    FOREIGN_PROVIDER: Foreign-provider signal only; not evidence of unlawful transfer.
    MIXED_REQUIRES_CONTRACT_CHECK: Service exposes multiple infrastructure/contract options; project configuration must be
      checked.
