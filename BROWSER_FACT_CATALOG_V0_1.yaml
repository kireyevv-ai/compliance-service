catalog:
  name: Browser Fact Catalog v0.1
  date: '2026-09-06'
  count: 17
  purpose: Минимальный browser-layer facts catalog для Playwright этапа.
  principles:
  - Browser facts are observations, not legal conclusions.
  - No form submission, clicks, login, purchase, or cookie-banner acceptance.
  - Do not store cookie/localStorage/sessionStorage values.
  - Network capture stores minimal request metadata/hostnames; no request/response bodies by default.
  - Playwright should run only on selected pages, not blindly on every crawled page.
  page_selection:
    max_browser_pages: 10
    priority:
    - homepage
    - pages_with_forms_or_personal_data_signals
    - pages_with_consent_or_marketing_signals
    - auth/login pages
    - checkout/order/cart-like pages
    fallback: Do not fill unused capacity merely to reach 10 pages.
