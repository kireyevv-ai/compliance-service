dataset:
  name: Compliance Golden Dataset v0.1
  date: '2026-09-06'
  source: LEGAL_RULEBASE_V0_1.md
  rule_count: 50
  purpose: Эталонная спецификация Rule Engine до материализации HTML fixtures.
  status_semantics:
    PASS: Правило применимо; достаточные факты показывают отсутствие условия нарушения/риска.
    FAIL: Условие обязательной нормы доказано достаточным evidence.
    WARNING: Обнаружен значимый риск/несоответствие, но вывод должен быть осторожным.
    MANUAL_CHECK: Автоматического evidence недостаточно; нужен юридический/бизнес-контекст.
    NO_EVALUATION: Правило не применяется к данному типу сайта/модулю; Finding не создаётся.
  acceptance:
  - Для каждого правила есть trigger, clear и not_applicable сценарий.
  - FAIL невозможен без evidence.
  - WARNING имеет evidence либо явно недостающий контекст.
  - MANUAL_CHECK не должен автоматически повышаться до FAIL.
  - Foreign server/script/endpoint сам по себе не даёт FAIL по трансграничной передаче/локализации.
rules:
- rule_id: PD-001
  title: Политика обработки ПД не найдена на сайте, который собирает ПД
  module: PERSONAL_DATA
  legal_strength: MANDATORY
  expected_status_when_triggered: FAIL
  activation: MVP
  trigger_facts:
  - personal_data_collection_found
  - privacy_policy_found=false
  minimum_evidence: URL формы + DOM формы + результат поиска политики
  legal_basis: 152-ФЗ, ст. 18.1 ч. 2
  remediation: Опубликовать политику и обеспечить к ней неограниченный доступ.
  golden_cases:
  - case_id: pd-001__trigger
    description: Применимый сайт; факты удовлетворяют условию правила.
    expected: FAIL
    assertions:
    - rule_is_applicable=true
    - all_required_trigger_facts_present=true
    - minimum_evidence_present=true
  - case_id: pd-001__clear
    description: Применимый сайт; собраны достаточные факты, и условие риска/нарушения не выполняется.
    expected: PASS
    assertions:
    - rule_is_applicable=true
    - required_facts_sufficient_for_clear_result=true
    - trigger_condition=false
  - case_id: pd-001__not_applicable
    description: Модуль/тип сайта не применим к правилу.
    expected: NO_EVALUATION
    assertions:
    - rule_is_applicable=false
    - finding_must_not_be_created=true
