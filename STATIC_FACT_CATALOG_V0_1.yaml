catalog:
  name: Static Fact Catalog v0.1
  purpose: Минимальный набор Facts для Task 004. Не включает Playwright, semantic document analysis, owner context или legal
    conclusions.
  count: 32
  rules:
  - Facts describe observations, not legal violations.
  - Absence facts require scan coverage context; do not infer site-wide absence from one page.
  - Personal values are masked/minimized where possible.
  - Static checked state is provisional until Playwright confirms actual rendered state.
  - Candidates (name/address/FIO etc.) must retain evidence snippet and confidence; Rule Engine decides whether evidence is
    sufficient.
facts:
- fact_type: form_found
  scope: PAGE
  source: H
  definition: Есть HTML-форма или эквивалентный form-like container в static DOM.
  used_by: PD-001, PD-003, PD-007
- fact_type: form_fields
  scope: PAGE
  source: H
  definition: 'Список полей: type/name/label/required/autocomplete; значения ПД не сохранять.'
  used_by: PD-001, PD-017, PD-024
- fact_type: personal_data_collection_found
  scope: PAGE
  source: H
  definition: Форма содержит поля, похожие на имя/e-mail/телефон/адрес/идентификаторы.
  used_by: PD-001, PD-003, PD-007, PD-020, PD-022
- fact_type: consent_control_found
  scope: PAGE
  source: H
  definition: Checkbox/radio/control рядом с формой с consent-like текстом.
  used_by: PD-005
- fact_type: pd_consent_control_found
  scope: PAGE
  source: H
  definition: Consent control связан именно с обработкой ПД.
  used_by: PD-006
- fact_type: control_prechecked_static
  scope: PAGE
  source: H
  definition: В raw HTML присутствует checked/selected state. Не считать финальным без Playwright.
  used_by: PD-006, PD-011
- fact_type: consent_text
  scope: PAGE
  source: H
  definition: Текст и ссылки, ассоциированные с consent control.
  used_by: PD-005, PD-008, PD-009, PD-010
- fact_type: marketing_consent_control_found
  scope: PAGE
  source: H
  definition: Control содержит маркетинговые/рекламные признаки.
  used_by: PD-010, PD-011
- fact_type: marketing_subscription_detected
  scope: PAGE
  source: H
  definition: Форма/CTA явно предлагает подписку/рассылку.
  used_by: PD-012, ADV-004
- fact_type: privacy_policy_link_found
  scope: PAGE/SITE
  source: H
  definition: Ссылка на документ, классифицированный как policy по anchor/href/title.
  used_by: PD-001, PD-002, PD-003
- fact_type: privacy_policy_url
  scope: SITE
  source: H
  definition: Нормализованный URL найденной policy.
  used_by: PD-002, PD-004
- fact_type: policy_access_from_collection_page
  scope: PAGE
  source: H
  definition: На странице формы есть прямая/глобальная доступная ссылка на policy.
  used_by: PD-003
- fact_type: offer_link_found
  scope: PAGE/SITE
  source: H
  definition: Ссылка, похожая на оферту/условия дистанционной продажи.
  used_by: EC-001, EC-002
- fact_type: offer_url
  scope: SITE
  source: H
  definition: Нормализованный URL оферты.
  used_by: EC-002
- fact_type: document_links
  scope: PAGE/SITE
  source: H
  definition: PDF/DOC/DOCX и юридические HTML documents; содержимое не парсить на T4.
